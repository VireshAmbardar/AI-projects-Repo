[project]
name = "AiBondScanner"
version = "0.1.0"
description = "AI-Powered Fixed Income Investment Advisor"
authors = [
    {name = "Viresh Ambardar",email = "ambardarviresh18@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "numpy (>=2.4.1,<3.0.0)",
    "fastapi[standard] (>=0.135.2,<0.136.0)",
    "uvicorn (>=0.40.0,<0.41.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "langchain (>=0.3.27,<0.4.0)",
    "chromadb (>=1.0.20,<2.0.0)",
    "psutil (>=7.2.2,<8.0.0)",
    "google-adk (>=2.3.0,<3.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "loguru (>=0.7.3,<0.8.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"



[tool.poetry]
package-mode = false


packages = [
    { include = "app" }
]

[tool.poetry.scripts]
start = "app.main:main"

